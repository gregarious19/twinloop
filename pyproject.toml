[project]
name = "twinloop"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs GPU and a trained model", "data: needs ImageCAS on /data"]
addopts = "-m 'not gpu and not data'"
